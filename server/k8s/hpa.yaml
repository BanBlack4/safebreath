apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: safebreath-backend-hpa
  namespace: safebreath-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: safebreath-backend
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric tracking WS connections
    # Requires Prometheus Adapter installed
    - type: Pods
      pods:
        metric:
          name: websocket_connections_active
        target:
          type: AverageValue
          averageValue: 4000
