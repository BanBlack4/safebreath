version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: safebreath-app-dev:latest
    container_name: safebreath-web-app-dev
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safebreath?schema=public
    # Ejecutamos directamente el archivo compilado de producción
    command: node dist/server.cjs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: safebreath-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safebreath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safebreath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: